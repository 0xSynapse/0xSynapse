<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 448" width="100%" height="448" fill="none">
  <style>
    .paper { fill: #FAF8F4; stroke: #DFDAD0; }
    .plate { fill: #FDFCF9; stroke: #C8C1B4; }
    .card { fill: #FAF8F4; stroke: #C8C1B4; }
    .mod { fill: #F2EFE9; stroke: #D0C9BC; }
    .mod-soft { fill: #F4F1EA; stroke: #C8C1B4; }
    .mod-mint { fill: #E3ECE7; stroke: #233E33; }
    .forest { fill: #233E33; }
    .mint { fill: #00C472; }
    .ink { fill: #151C19; }
    .rule { stroke: #DFDAD0; }
    .rule-soft { stroke: #E5E0D5; }
    .serif-h1 { fill: #151C19; font-family: "Newsreader", Georgia, "Noto Serif SC", "Songti SC", serif; font-weight: 400; }
    .serif-em { fill: #233E33; font-family: "Newsreader", Georgia, "Noto Serif SC", "Songti SC", serif; font-style: italic; font-weight: 400; }
    .sans-body { fill: #151C19; font-family: "Inter", -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; font-weight: 400; }
    .sans-muted { fill: #525B56; font-family: "Inter", -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; font-weight: 400; }
    .mono-label { fill: #848D88; font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-weight: 500; letter-spacing: 1.4px; }
    .mono-forest { fill: #233E33; font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-weight: 600; letter-spacing: 0.8px; }
    .mono-ink { fill: #151C19; font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-weight: 500; }
    .mono-sub { fill: #525B56; font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-weight: 400; }
    .brand-word { fill: #151C19; font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif; font-weight: 700; letter-spacing: 3.2px; }
  </style>

  <!-- Outer Nordic Warm Paper Frame -->
  <rect class="paper" x="1" y="1" width="958" height="446" stroke-width="1"/>

  <!-- Top Navigation / Identity Bar -->
  <g transform="translate(36, 20)">
    <g transform="scale(0.22)">
      <rect class="ink" x="0" y="10" width="18" height="80" rx="9"/>
      <rect class="ink" x="62" y="30" width="18" height="60" rx="9"/>
      <rect class="mint" x="14" y="42" width="52" height="18" rx="9"/>
      <circle class="mint" cx="80" cy="20" r="11"/>
    </g>
    <text class="brand-word" x="28" y="16" font-size="11.5">HUI ZHAO · @0xSYNAPSE</text>
    <text class="mono-label" x="888" y="15" text-anchor="end" font-size="9.5">HEURION RESEARCH · ROTTERDAM, NL</text>
  </g>
  <line class="rule" x1="1" y1="54" x2="959" y2="54" stroke-width="1"/>

  <!-- ==================== LEFT COLUMN: EDITORIAL HERO ==================== -->
  <text class="mono-label" x="36" y="92" font-size="9.5">HEURION RESEARCH · CLINICAL AI WORKSTATION &amp; AGENT OS</text>

  <text class="serif-h1" x="36" y="136" font-size="31">Verifiable systems for</text>
  <text class="serif-h1" x="36" y="174" font-size="31"><tspan class="serif-em">clinical medicine</tspan> and</text>
  <text class="serif-h1" x="36" y="212" font-size="31"><tspan class="serif-em">autonomous agents</tspan>.</text>

  <text class="sans-muted" x="36" y="242" font-size="13.5">为临床医学与自治智能体，构建可验证的系统底座。</text>

  <!-- Editorial Row 1: WHO I AM -->
  <line class="rule" x1="36" y1="272" x2="436" y2="272" stroke-width="1"/>
  <text class="mono-label" x="36" y="295" font-size="9">WHO I AM</text>
  <text class="sans-body" x="132" y="295" font-size="12.5">Founder of Heurion Research. Systems &amp; AI researcher —</text>
  <text class="sans-body" x="132" y="314" font-size="12.5">the human link between users and builders.</text>
  <text class="sans-muted" x="132" y="333" font-size="11.5">专注临床证据合成与智能体操作系统的独立研究与工程构建。</text>

  <!-- Editorial Row 2: OUR THESIS -->
  <line class="rule" x1="36" y1="352" x2="436" y2="352" stroke-width="1"/>
  <text class="mono-label" x="36" y="375" font-size="9">THESIS</text>
  <text class="sans-muted" x="132" y="375" font-size="12">Models generate probabilities; science demands certainty.</text>
  <text class="sans-muted" x="132" y="393" font-size="12">Bound to transactional state, intelligence becomes infrastructure.</text>
  <text class="sans-muted" x="132" y="412" font-size="11.5">模型长于推理，科学始于确定。锚定契约内核，智能方成底座。</text>

  <!-- ==================== RIGHT COLUMN: NORDIC ARCHITECTURAL PLATE ==================== -->
  <g transform="translate(468, 72)">
    <rect class="plate" x="0" y="0" width="456" height="352" stroke-width="1"/>

    <!-- Plate Header -->
    <text class="mono-label" x="18" y="22" font-size="8.5">ARCHITECTURE — DUAL-LAYER STACK</text>
    <text class="mono-label" x="438" y="22" text-anchor="end" font-size="8.5">AAP-1.0 SPEC</text>
    <line class="rule" x1="0" y1="32" x2="456" y2="32" stroke-width="1"/>

    <!-- Subtle Background Astrolabe Meridian Ring -->
    <circle cx="228" cy="176" r="134" stroke="#DCD6CA" stroke-width="1" stroke-dasharray="2 4"/>
    <circle cx="228" cy="176" r="98" stroke="#E4DFD5" stroke-width="1"/>
    <line x1="228" y1="36" x2="228" y2="318" stroke="#E2DDD3" stroke-width="1"/>

    <!-- L2: HEURION 2.0 & OMNICANVAS -->
    <rect class="card" x="18" y="44" width="420" height="98" stroke-width="1"/>
    <text class="mono-forest" x="30" y="60" font-size="8.5">L2 · HEURION 2.0 &amp; OMNICANVAS</text>
    <text class="mono-label" x="426" y="60" text-anchor="end" font-size="8">YJS CRDT CANVAS</text>
    <line class="rule-soft" x1="18" y1="68" x2="438" y2="68" stroke-width="1"/>

    <!-- 3 L2 Modules -->
    <rect class="mod" x="30" y="78" width="122" height="52" stroke-width="1"/>
    <text class="mono-ink" x="91" y="98" text-anchor="middle" font-size="8.5">DOCX / PPTX</text>
    <text class="mono-sub" x="91" y="113" text-anchor="middle" font-size="7.5">node_id Lock · 96.4%</text>
    <circle class="forest" cx="91" cy="130" r="2.2"/>

    <rect class="mod" x="167" y="78" width="122" height="52" stroke-width="1"/>
    <text class="mono-ink" x="228" y="98" text-anchor="middle" font-size="8.5">BIOSTATISTICS</text>
    <text class="mono-sub" x="228" y="113" text-anchor="middle" font-size="7.5">Table 1 · KM · CONSORT</text>
    <circle class="forest" cx="228" cy="130" r="2.2"/>

    <rect class="mod" x="304" y="78" width="122" height="52" stroke-width="1"/>
    <text class="mono-ink" x="365" y="98" text-anchor="middle" font-size="8.5">PHI GATEKEEPER</text>
    <text class="mono-sub" x="365" y="113" text-anchor="middle" font-size="7.5">Local De-ID · 99.6%</text>
    <circle class="forest" cx="365" cy="130" r="2.2"/>

    <!-- Bus Routing into AAP-1.0 Bridge -->
    <path d="M91 130 L91 152 L228 152" stroke="#848D88" stroke-width="1"/>
    <line x1="228" y1="130" x2="228" y2="160" stroke="#233E33" stroke-width="1.2"/>
    <path d="M365 130 L365 152 L228 152" stroke="#848D88" stroke-width="1"/>

    <line x1="22" y1="175" x2="84" y2="175" stroke="#C8C1B4" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="372" y1="175" x2="434" y2="175" stroke="#C8C1B4" stroke-width="1" stroke-dasharray="3 3"/>

    <!-- AAP-1.0 Cryptographic Lease Capsule -->
    <rect class="forest" x="86" y="159" width="284" height="32" rx="16"/>
    <circle cx="108" cy="175" r="6" stroke="#00C472" stroke-opacity="0.45" stroke-width="1"/>
    <circle class="mint" cx="108" cy="175" r="3.2"/>
    <text x="236" y="178" text-anchor="middle" fill="#FAF8F4" font-family="JetBrains Mono, monospace" font-size="8" font-weight="500" letter-spacing="0.8">AAP-1.0 · ED25519 LEASE &amp; MCP BUS</text>

    <line x1="228" y1="191" x2="228" y2="208" stroke="#233E33" stroke-width="1.2"/>

    <!-- L1: AEGIS OS KERNEL -->
    <rect class="card" x="18" y="208" width="420" height="108" stroke-width="1"/>
    <text class="mono-forest" x="30" y="224" font-size="8.5">L1 · AEGIS OS (aegis-os)</text>
    <text class="mono-label" x="426" y="224" text-anchor="end" font-size="8">RUST · COW × 3-WAY MERGE</text>
    <line class="rule-soft" x1="18" y1="232" x2="438" y2="232" stroke-width="1"/>

    <!-- CoW Fork Node -->
    <rect class="mod" x="30" y="255" width="90" height="38" stroke="#233E33" stroke-width="1"/>
    <text class="mono-ink" x="75" y="271" text-anchor="middle" font-size="8">COW FORK</text>
    <text class="mono-sub" x="75" y="284" text-anchor="middle" font-size="7.2">0.42ms Clone</text>

    <!-- DAG Fork Lines -->
    <path d="M120 274 L140 274 L150 248 L162 248" stroke="#848D88" stroke-width="1"/>
    <line x1="120" y1="274" x2="162" y2="274" stroke="#233E33" stroke-width="1.1"/>
    <path d="M120 274 L140 274 L150 300 L162 300" stroke="#848D88" stroke-width="1"/>

    <!-- 3 Parallel Shadow Workspaces -->
    <rect class="mod-soft" x="162" y="238" width="132" height="20" stroke-width="1"/>
    <text class="mono-sub" x="228" y="251" text-anchor="middle" font-size="7.4">Shadow A · Agent 01</text>

    <rect class="mod-mint" x="162" y="264" width="132" height="20" stroke-width="1"/>
    <text class="mono-ink" x="228" y="277" text-anchor="middle" font-size="7.4">Shadow B · Agent 02</text>

    <rect class="mod-soft" x="162" y="290" width="132" height="20" stroke-width="1"/>
    <text class="mono-sub" x="228" y="303" text-anchor="middle" font-size="7.4">Shadow C · Agent 03</text>

    <!-- DAG Merge Lines -->
    <path d="M294 248 L306 248 L316 274 L336 274" stroke="#848D88" stroke-width="1"/>
    <line x1="294" y1="274" x2="336" y2="274" stroke="#233E33" stroke-width="1.1"/>
    <path d="M294 300 L306 300 L316 274 L336 274" stroke="#848D88" stroke-width="1"/>

    <!-- 3-Way Merge Node -->
    <rect class="forest" x="336" y="255" width="90" height="38"/>
    <text x="381" y="271" text-anchor="middle" fill="#FAF8F4" font-family="JetBrains Mono, monospace" font-size="8" font-weight="500">3-WAY MERGE</text>
    <text x="381" y="284" text-anchor="middle" fill="#00C472" font-family="JetBrains Mono, monospace" font-size="7.2">0% Overwrite</text>

    <!-- Plate Footer -->
    <line class="rule" x1="0" y1="324" x2="456" y2="324" stroke-width="1"/>
    <text class="mono-label" x="18" y="342" font-size="8.2">L2 CLINICAL WORKSTATION</text>
    <text class="mono-label" x="438" y="342" text-anchor="end" font-size="8.2">L1 TRANSACTIONAL AGENT OS</text>
  </g>
</svg>
