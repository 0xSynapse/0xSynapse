  <rect class="pill" x="28" y="190" width="276" height="24" rx="6" stroke-width="1"/>
  <text class="muted" x="40" y="206" font-size="10.5">Protocols: MCP · Google A2A · AAP-1.0 · UOMP-00</text>

  <rect class="pill" x="312" y="190" width="276" height="24" rx="6" stroke-width="1"/>
