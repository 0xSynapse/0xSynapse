  <line class="divider" x1="628" y1="54" x2="878" y2="54" stroke-width="1"/>

  <text class="metric-val" x="628" y="76" font-size="12.5">2 Preprints + 1 RFC</text>
  <text class="muted" x="768" y="76" font-size="10.5">cs.OS / CR / AI</text>

  <text class="metric-val" x="628" y="102" font-size="12.5">-90.7% to -99.9%</text>
  <text class="muted" x="768" y="102" font-size="10.5">Auth Prompts</text>

  <text class="metric-val" x="628" y="128" font-size="12.5">0.0% ASR (0/80)</text>
  <text class="muted" x="768" y="128" font-size="10.5">Red-Team Eval</text>

  <text class="metric-val" x="628" y="154" font-size="12.5">6.3ms / 15.6ms</text>
  <text class="muted" x="768" y="154" font-size="10.5">CoW Fork Latency</text>

  <text class="metric-val" x="628" y="180" font-size="12.5">98.6% PHI Recall</text>
  <text class="muted" x="768" y="180" font-size="10.5">2-Stage Funnel</text>

  <text class="metric-val" x="628" y="202" font-size="12.5">-49% Rejections</text>
  <text class="muted" x="768" y="202" font-size="10.5">Evolving Memory</text>
</svg>
